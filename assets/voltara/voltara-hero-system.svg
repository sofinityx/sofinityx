<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">VOLTARA performance nutrition hero system</title>
  <desc id="desc">A designed VOLTARA hero composition showing the IGNITE, HYDRA, and RECOVER product family with structured athletic graphic elements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090d"/>
      <stop offset="0.48" stop-color="#101114"/>
      <stop offset="1" stop-color="#171018"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="26%" cy="26%" r="42%">
      <stop offset="0" stop-color="#ff6230" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ff6230" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="78%" cy="28%" r="40%">
      <stop offset="0" stop-color="#14c8e8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#14c8e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="52%" cy="82%" r="44%">
      <stop offset="0" stop-color="#a45cff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#a45cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="34" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="760" rx="18" fill="url(#orangeGlow)"/>
  <rect width="1200" height="760" rx="18" fill="url(#cyanGlow)"/>
  <rect width="1200" height="760" rx="18" fill="url(#violetGlow)"/>

  <g opacity="0.32">
    <path d="M60 626H1140" stroke="#f4f0e8" stroke-opacity="0.22"/>
    <path d="M60 156H1140" stroke="#f4f0e8" stroke-opacity="0.14"/>
    <path d="M186 80V686" stroke="#f4f0e8" stroke-opacity="0.08"/>
    <path d="M1014 80V686" stroke="#f4f0e8" stroke-opacity="0.08"/>
    <path d="M132 598 428 118h56L188 598h-56Z" fill="#ff6230" opacity="0.36"/>
    <path d="M716 646 1012 166h56L772 646h-56Z" fill="#14c8e8" opacity="0.26"/>
    <path d="M500 670 796 190h46L546 670h-46Z" fill="#f4f0e8" opacity="0.1"/>
  </g>

  <g transform="translate(86 98)">
    <text x="0" y="0" fill="#f4f0e8" font-family="Arial Narrow, Arial, sans-serif" font-size="78" font-weight="900" letter-spacing="4">VOLTARA</text>
    <text x="2" y="48" fill="#d7dde0" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="6">PERFORMANCE NUTRITION SYSTEM</text>
    <rect x="2" y="82" width="158" height="6" fill="#ff6230"/>
    <rect x="174" y="82" width="118" height="6" fill="#14c8e8"/>
    <rect x="306" y="82" width="84" height="6" fill="#a45cff"/>
  </g>

  <g filter="url(#shadow)">
    <image href="product/pack-ignite.svg" x="260" y="162" width="266" height="430" preserveAspectRatio="xMidYMid meet"/>
    <image href="product/pack-hydra.svg" x="468" y="190" width="250" height="404" preserveAspectRatio="xMidYMid meet"/>
    <image href="product/pack-recover.svg" x="660" y="148" width="290" height="468" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g transform="translate(806 94)">
    <rect x="0" y="0" width="250" height="88" rx="8" fill="#f4f0e8" fill-opacity="0.08" stroke="#f4f0e8" stroke-opacity="0.14"/>
    <text x="24" y="34" fill="#f4f0e8" font-family="Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="2">PRODUCT ARCHITECTURE</text>
    <text x="24" y="62" fill="#d7dde0" font-family="Arial, sans-serif" font-size="13">Ignite / Hydra / Recover</text>
  </g>

  <g transform="translate(92 564)">
    <rect x="0" y="0" width="238" height="76" rx="8" fill="#f4f0e8" fill-opacity="0.08" stroke="#f4f0e8" stroke-opacity="0.14"/>
    <text x="22" y="30" fill="#f4f0e8" font-family="Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="2">BUILT FOR THE NEXT REP</text>
    <text x="22" y="54" fill="#d7dde0" font-family="Arial, sans-serif" font-size="13">Disciplined energy, clean hierarchy.</text>
  </g>

  <g transform="translate(880 604)" opacity="0.94">
    <circle cx="0" cy="0" r="7" fill="#ff6230"/>
    <circle cx="42" cy="0" r="7" fill="#14c8e8"/>
    <circle cx="84" cy="0" r="7" fill="#a45cff"/>
    <path d="M0 26H194" stroke="#f4f0e8" stroke-opacity="0.28"/>
  </g>
</svg>
