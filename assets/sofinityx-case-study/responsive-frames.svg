<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">SofinityX responsive frames</title>
  <desc id="desc">A portfolio presentation board showing desktop, tablet, and mobile frames for the SofinityX website.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#26172d"/>
      <stop offset=".48" stop-color="#141321"/>
      <stop offset="1" stop-color="#1b241d"/>
    </linearGradient>
    <radialGradient id="pink" cx=".28" cy=".24" r=".48">
      <stop offset="0" stop-color="#ff4fc4" stop-opacity=".58"/>
      <stop offset="1" stop-color="#ff4fc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aqua" cx=".74" cy=".66" r=".5">
      <stop offset="0" stop-color="#3ee6d4" stop-opacity=".46"/>
      <stop offset="1" stop-color="#3ee6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
